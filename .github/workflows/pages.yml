# Builds the firmware with PlatformIO and publishes the browser installer (webflasher/) to GitHub Pages,
# with the freshly built firmware next to it (same origin, so the page can fetch the images).
# One-time setup: repository Settings > Pages > Build and deployment > Source: "GitHub Actions".
name: Web installer (GitHub Pages)

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "platformio.ini"
      - "webflasher/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
          restore-keys: pio-${{ runner.os }}-

      - name: Install PlatformIO
        run: pip install platformio

      - name: Build firmware
        run: pio run

      - name: Assemble site
        run: |
          VERSION="$(date -u +%Y.%-m.%-d).${{ github.run_number }}"
          BOOT_APP0="$(find "$HOME/.platformio/packages" -name boot_app0.bin | head -n 1)"
          mkdir -p _site/firmware
          cp webflasher/index.html webflasher/style.css webflasher/flasher.js _site/
          cp -r webflasher/vendor _site/vendor
          python webflasher/build_bundle.py \
            --build-dir .pio/build/esp32-s3-zero \
            --boot-app0 "$BOOT_APP0" \
            --out _site/firmware \
            --version "$VERSION" \
            --commit "${{ github.sha }}"
          ls -la _site _site/firmware

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
